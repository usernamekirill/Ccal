[project]
name = "calorie-telegram-bot"
version = "0.1.0"
description = "Telegram bot for calorie tracking from photos, text, and audio."
requires-python = ">=3.11"
dependencies = [
    "aiogram>=3.0",
    "alembic>=1.13",
    "aiosqlite>=0.19",
    "httpx>=0.27",
    "openai>=1.0",
    "pillow>=10.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
]

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = [
    "calorie_bot",
    "calorie_bot.app",
    "calorie_bot.app.ai",
    "calorie_bot.app.bot",
    "calorie_bot.app.database",
    "calorie_bot.app.handlers",
    "calorie_bot.app.health",
    "calorie_bot.app.keyboards",
    "calorie_bot.app.messages",
    "calorie_bot.app.middleware",
    "calorie_bot.app.nlp",
    "calorie_bot.app.ratelimit",
    "calorie_bot.app.repositories",
    "calorie_bot.app.security",
    "calorie_bot.app.services",
    "calorie_bot.app.states",
    "calorie_bot.app.stats",
    "calorie_bot.app.storage",
    "calorie_bot.app.texts",
    "calorie_bot.app.trends",
    "calorie_bot.app.utils",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"calorie_bot/app/ai/prompts.py" = ["E501"]
